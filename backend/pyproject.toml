[project]
name = "buildable-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cpieper", email = "pieper.chris@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "pwdlib[argon2]>=0.3.1,<1",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.52,<3",
]

[project.scripts]
buildable = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.16.3,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
